<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fabled Lands Character Sheet</title>
<style>
  /* Palette matches the D&D 5e character sheet's "Leather"(dark, default)
     and "Parchment"(light) themes exactly -- same hex values -- so the two
     sheets feel like one family. Toggled via toggleTheme()/data-theme, same
     mechanism as before, just re-colored. */
  :root{
    --bg: #efe4cc;
    --panel: #faf3e4;
    --panel-2: #f0e6d2;
    --line: #c2ac7e;
    --ink: #2b2013;
    --ink-dim: #5b4a30;
    --ink-faint: #8a7551;
    --gold: #8a6d1f;
    --gold-bright: #6b530f;
    --blood: #8b2635;
    --blood-bright: #a8384a;
    --forest: #3f6d4f;
    --forest-bright: #2f5a3d;
    --input-bg: rgba(255,255,255,0.55);
    --shadow: rgba(60,45,20,0.18);
    --radius: 3px;
    --disabled-bg: #cabb98;
    --disabled-border: #b3a37a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0d120e;
      --panel: #1c150f;
      --panel-2: #221a12;
      --line: #3a2c1c;
      --ink: #e8dcc0;
      --ink-dim: #b8a97e;
      --ink-faint: #8a7b57;
      --gold: #c9a227;
      --gold-bright: #e8c14f;
      --blood: #8b2635;
      --blood-bright: #c4485c;
      --forest: #3f6d4f;
      --forest-bright: #6fae82;
      --input-bg: rgba(0,0,0,0.25);
      --shadow: rgba(0,0,0,0.55);
      --disabled-bg: #362a1c;
      --disabled-border: #4a3a24;
    }
  }
  :root[data-theme="dark"]{
    --bg: #0d120e;
    --panel: #1c150f;
    --panel-2: #221a12;
    --line: #3a2c1c;
    --ink: #e8dcc0;
    --ink-dim: #b8a97e;
    --ink-faint: #8a7b57;
    --gold: #c9a227;
    --gold-bright: #e8c14f;
    --blood: #8b2635;
    --blood-bright: #c4485c;
    --forest: #3f6d4f;
    --forest-bright: #6fae82;
    --input-bg: rgba(0,0,0,0.25);
    --shadow: rgba(0,0,0,0.55);
    --disabled-bg: #362a1c;
    --disabled-border: #4a3a24;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    line-height: 1.4;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  h1,h2,h3{ font-family: Georgia, 'Palatino Linotype', serif; color: var(--gold); margin: 0 0 0.4em; }
  a{ color: var(--gold-bright); }
  button, input, select, textarea{ font-family: inherit; font-size: 15px; color: var(--ink); }
  input, select, textarea{
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 6px 8px;
  }
  input:focus, select:focus, textarea:focus{ outline: 1px solid var(--gold); outline-offset: 1px; }
  textarea{ resize: vertical; width: 100%; font-family: inherit; }
  button{
    cursor: pointer;
    background: var(--panel-2);
    color: var(--gold-bright);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 7px 12px;
    font-weight: bold;
    letter-spacing: 0.3px;
  }
  button:hover{ border-color: var(--gold-bright); background: var(--panel); }
  button:disabled{ background: var(--disabled-bg); border-color: var(--disabled-border); color: var(--ink-faint); cursor:not-allowed; }
  button.secondary{ background: var(--panel-2); color: var(--ink); border-color: var(--line); }
  button.secondary:hover{ border-color: var(--gold); color: var(--gold-bright); }
  button.icon-btn{ padding: 6px 9px; font-weight: normal; }
  button.link-btn{ background:none; border:none; color: var(--gold-bright); text-decoration: underline; padding: 2px 4px; font-weight: normal; }
  button.link-btn:hover{ background: var(--panel-2); }

  .topbar{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border-bottom: 1px solid var(--line);
    box-shadow: 0 2px 8px var(--shadow);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-mini{
    max-width: 1100px; margin: 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
  }
  .current-page-strip{
    flex: 1; min-width: 0;
    font-size: 1.05rem; font-weight: bold; color: var(--gold-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar-controls{
    max-width: 1100px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 0 14px 12px;
  }
  .topbar select{ min-width: 140px; }
  .save-status{ font-size: 0.78rem; color: var(--ink-faint); white-space: nowrap; margin-left: auto; }

  main{ max-width: 1100px; margin: 18px auto; padding: 0 14px; }
  .panels{ display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
  @media (min-width: 680px){ .panels{ grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); } }
  .panel{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 4px 14px var(--shadow);
    padding: 14px 16px;
  }
  .panel.wide{ grid-column: 1 / -1; }
  .ref-toggle{ cursor: pointer; user-select: none; }
  .panel.folded{ padding-bottom: 14px; }
  .panel.folded > *:not(h2){ display: none !important; }
  .journey-panel{ border-width: 2px; border-color: var(--gold); }
  .journey-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .path-track{ display:flex; align-items:center; overflow-x:auto; padding:10px 2px; -webkit-overflow-scrolling:touch; }
  .path-node{
    flex: none; width:38px; height:38px; border-radius:50%;
    background: var(--input-bg); border:2px solid var(--line); color: var(--ink);
    font-weight:bold; font-size:0.8rem; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .path-node.active{ border-color: var(--gold-bright); background: var(--gold); color:#211705; }
  .path-line{ flex: none; width:18px; height:2px; background: var(--line); }
  .path-detail{ margin-top:8px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background: var(--input-bg); }
  .path-detail p{ margin: 4px 0 0; }
  .panel h2{ font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; display:flex; align-items:center; gap:8px; }
  .field-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .field{ display:flex; flex-direction: column; gap: 3px; }
  .field label{ font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-faint); font-weight: bold; }
  .computed-value{ font-size: 1.3rem; font-weight: bold; color: var(--gold-bright); background: var(--input-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; text-align: center; }
  .formula-note{ font-size: 0.72rem; color: var(--ink-faint); margin: 4px 0 0; }
  .field input, .field select{ width: 100%; }

  .abilities-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; }
  .ability-box{ background: var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:8px; text-align:center; position:relative; }
  .ability-box label{ display:block; font-size:0.72rem; font-weight:bold; color: var(--gold); margin-bottom:4px; text-transform: uppercase; letter-spacing: 1px; }
  .ability-box input{ width: 100%; text-align:center; font-size: 1.3rem; font-weight:bold; color: var(--gold-bright); background: var(--input-bg); }
  .ability-roll-btn{ margin-top:6px; width:100%; padding:4px 6px; font-size:0.78rem; }
  .ability-roll-flash{ margin-top:5px; font-size:0.85rem; font-weight:bold; color: var(--blood-bright); }

  .stamina-bar-outer{ background: #000; border:1px solid var(--line); border-radius: 6px; height: 14px; overflow:hidden; margin: 8px 0; }
  .stamina-bar-inner{ height:100%; background: linear-gradient(90deg, var(--forest), var(--forest-bright)); transition: width 0.25s ease; }
  .stamina-bar-inner.low{ background: linear-gradient(90deg, var(--blood), var(--blood-bright)); }
  .quick-adjust{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .quick-adjust button{ padding: 5px 9px; }

  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; min-height: 1.6em; }
  .chip{
    background: var(--panel-2); border:1px solid var(--line); border-radius: 20px;
    padding: 4px 6px 4px 12px; font-size: 0.88rem; display:flex; align-items:center; gap:6px;
  }
  .chip-remove{ background:none; border:none; color: var(--ink-faint); font-weight:bold; font-size: 1rem; line-height:1; padding: 2px 6px; border-radius: 50%; }
  .chip-remove:hover{ background: rgba(139,38,53,0.18); color: var(--blood-bright); }
  .possession-chip{ padding-right: 4px; }
  .chip-stat-select{ width: 62px; padding: 2px 16px 2px 6px; font-size: 0.78rem; border-radius: 12px; background-position: right 4px center; }
  .chip-def-input{
    width: 40px; padding: 2px 2px; text-align:center; font-size: 0.82rem; border-radius: 12px;
    -moz-appearance: textfield;
  }
  .chip-def-input::-webkit-outer-spin-button, .chip-def-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .journey-note-input{ min-height: 34px; font-size: 0.9rem; }
  .chip-equip-toggle{
    background:none; border:1px solid var(--line); border-radius:50%; width:22px; height:22px;
    padding:0; font-size:0.85rem; line-height:1; color: var(--ink-faint); display:flex; align-items:center; justify-content:center;
  }
  .chip-equip-toggle.active{ border-color: var(--gold); background: var(--gold); color:#211705; }
  .chip-equip-toggle:disabled{ opacity:0.35; cursor:not-allowed; }
  .empty-hint{ color: var(--ink-faint); font-style: italic; font-size: 0.88rem; margin: 0 0 8px; }
  .chip-add-form{ display:flex; gap:6px; }
  .chip-add-form input{ flex:1; }
  .count-badge{ font-size: 0.72rem; font-weight:normal; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px 8px; color: var(--ink-dim); }
  .count-badge.count-full{ background: var(--blood); border-color: var(--blood-bright); color:#fff; }
  .cap-warning{ font-size: 0.82rem; color: var(--blood-bright); margin: 6px 0 0; }

  table.entry-table{ width:100%; border-collapse: collapse; font-size: 0.9rem; }
  table.entry-table th{ text-align:left; font-size: 0.68rem; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.entry-table td{ padding: 4px 6px; vertical-align: top; }
  table.entry-table input, table.entry-table select{ width: 100%; }
  table.entry-table .col-del{ width: 34px; text-align:center; }
  table.entry-table .col-check{ width: 32px; text-align:center; }
  tr.tick-checked, .entry-card.tick-checked{ opacity: 0.55; }
  .tick-check-label{ display:flex; align-items:center; gap:6px; margin-bottom:8px; font-weight:bold; font-size:0.82rem; color: var(--ink-faint); }
  .entry-cards{ display:none; }
  @media (max-width: 640px){
    table.entry-table{ display:none; }
    .entry-cards{ display:block; }
    .entry-card{ border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:8px; background: var(--panel-2); }
    .entry-card .field{ margin-bottom:6px; }
    .entry-card .row-del{ width:100%; margin-top:4px; }
  }

  .dice-panel .roll-buttons{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 10px; }
  .dice-result{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-height: 58px; }
  .die-face{
    width:40px; height:40px; background: var(--input-bg); border:2px solid var(--gold); border-radius:6px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:5px; flex:none;
  }
  .die-face .dot{ width:7px; height:7px; border-radius:50%; background: var(--gold-bright); justify-self:center; align-self:center; }
  .die-face .dot.empty{ background:transparent; }
  .dice-total{ font-size: 1.6rem; font-weight:bold; color: var(--gold-bright); }
  .dice-history{ margin-top:10px; font-size:0.82rem; color: var(--ink-dim); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .dice-history span{ background: var(--panel-2); border: 1px solid var(--line); border-radius:6px; padding:2px 7px; display:inline-flex; align-items:center; gap:4px; }
  .dice-hint-text{ font-size: 0.82rem; color: var(--ink-faint); }

  .no-characters{ text-align:center; padding: 60px 20px; }
  .no-characters h2{ font-size: 1.5rem; }
  .no-characters .actions{ display:flex; gap:10px; justify-content:center; margin-top: 18px; flex-wrap:wrap; }

  .modal-backdrop{ position:fixed; inset:0; background: rgba(10,7,3,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding: 16px; }
  .modal-box{ background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%); border:1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: 480px; width:100%; max-height: 88vh; overflow:auto; padding: 18px 20px; }
  .modal-box h2{ margin-top:0; }
  .modal-row{ margin-bottom: 12px; display:flex; flex-direction:column; gap:4px; }
  .modal-row label{ font-size:0.72rem; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; color: var(--ink-faint); }
  .modal-row input, .modal-row textarea{ width:100%; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top: 16px; flex-wrap:wrap; }
  .modal-hint{ font-size: 0.82rem; color: var(--ink-faint); margin: 4px 0 0; }
  .share-link-box{ width:100%; font-family: monospace; font-size: 0.78rem; }
  .import-error{ color: var(--blood-bright); font-size: 0.85rem; }
  .divider{ border:none; border-top: 1px solid var(--line); margin: 16px 0; }

  footer{ max-width: 1100px; margin: 30px auto 10px; padding: 0 14px; text-align:center; font-size: 0.78rem; color: var(--ink-faint); }

  @media print{
    .topbar, .no-print, .modal-backdrop{ display:none !important; }
    body{ background:#fff; color:#000; }
    .panel{ box-shadow:none; break-inside: avoid; background: #fff; }
  }

  /* ============ 3D dice overlay ============ */
  #dice-3d-overlay{
    position:fixed; inset:0; z-index:500;
    background:transparent;
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease-out;
  }
  #dice-3d-overlay.visible{ opacity:1; pointer-events:auto; }
  #dice-3d-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #dice-3d-labels{ position:absolute; inset:0; pointer-events:none; }
  .dice-3d-hint{
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    max-width:90vw; text-align:center;
    background:rgba(255,255,255,0.75); padding:8px 22px; border-radius:10px;
    color:#241c0f; font-size:28px; font-family:Georgia,serif; font-weight:700;
    letter-spacing:1px; text-transform:uppercase;
    opacity:0; transition:opacity 0.3s ease-out; pointer-events:none;
  }
  .dice-3d-hint.visible{ opacity:1; }
  .dice-3d-banner{
    position:absolute; transform:translate(-50%,-50%);
    text-align:center; opacity:0;
    max-width:92vw; box-sizing:border-box;
    padding:8px 16px;
    background:rgba(10,8,4,0.72); border:1px solid rgba(201,162,39,0.45); border-radius:10px;
    transition:opacity 0.25s ease-out, transform 0.45s cubic-bezier(.34,1.2,.4,1);
  }
  .dice-3d-banner.visible{ opacity:1; }
  .dice-3d-banner-title{
    font-size:24px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    color:#c9a227; text-shadow:0 0 4px #000,0 0 8px #000; margin-bottom:2px;
  }
  .dice-3d-banner-value{
    font-size:clamp(20px,6.5vw,45px); font-weight:800; font-family:Georgia,serif; line-height:1.15;
    color:#f5e9c8; text-shadow:0 0 6px #000,0 0 14px #000,0 2px 3px #000;
    white-space:normal; overflow-wrap:anywhere; word-break:break-word;
  }
  .dice-3d-tap-hint{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    color:#cbb98a; font-size:14px; opacity:0; transition:opacity 0.4s ease-out 0.6s;
    pointer-events:none;
  }
  .dice-3d-tap-hint.visible{ opacity:0.85; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none" onchange="handleImportFile(this)">

<div id="dice-3d-overlay" onclick="dismissDiceOverlay()">
  <canvas id="dice-3d-canvas"></canvas>
  <div id="dice-3d-labels"></div>
  <div class="dice-3d-hint" id="dice-3d-hint"></div>
  <div class="dice-3d-tap-hint visible">Tap anywhere to dismiss</div>
</div>
<script>

<script>
"use strict";

/* ---------- utilities ---------- */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function clamp(n, lo, hi){ return Math.max(lo, Math.min(hi, n)); }
// Starting row count for a textarea sized to its existing content, so it
// opens already-expanded instead of needing a first keystroke to grow.
function estimateTextRows(text){
  const lines = String(text||"").split("\n");
  let rows = 0;
  lines.forEach(l => { rows += Math.max(1, Math.ceil(l.length/48)); });
  return Math.max(1, Math.min(14, rows));
}

/* ---------- storage ---------- */
const LS_PREFIX = "fl-sheet:";
const memoryStore = {};
let persistent = true;
let lsChecked = false, lsOk = false;
function lsAvailable(){
  if(lsChecked) return lsOk;
  lsChecked = true;
  try{ const k = "__t__"+Date.now(); localStorage.setItem(k,"1"); localStorage.removeItem(k); lsOk = true; }
  catch(e){ lsOk = false; }
  return lsOk;
}
function storageGet(key, fallback){
  if(lsAvailable()){
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      persistent = true;
      return raw !== null ? JSON.parse(raw) : fallback;
    }catch(e){}
  }
  persistent = false;
  return memoryStore.hasOwnProperty(key) ? memoryStore[key] : fallback;
}
function storageSet(key, value){
  if(lsAvailable()){
    try{ localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); persistent = true; return; }
    catch(e){}
  }
  persistent = false;
  memoryStore[key] = value;
}
function storageDelete(key){
  try{ localStorage.removeItem(LS_PREFIX+key); }catch(e){}
  delete memoryStore[key];
}

/* ---------- theme (global preference, not per-character) ---------- */
let theme = storageGet("theme", null); // 'light' | 'dark' | null (null = follow system)
function effectiveTheme(){
  if(theme) return theme;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function applyTheme(){
  if(theme) document.documentElement.setAttribute("data-theme", theme);
  else document.documentElement.removeAttribute("data-theme");
}
function toggleTheme(){
  theme = effectiveTheme() === "dark" ? "light" : "dark";
  storageSet("theme", theme);
  applyTheme();
  render();
}

/* ---------- data model ---------- */
const FL_BOOKS = [
  "The War-Torn Kingdom",
  "Cities of Gold and Glory",
  "Over the Blood-Dark Sea",
  "The Plains of Howling Darkness",
  "The Court of Hidden Faces",
  "Lords of the Rising Sun",
  "The Serpent King's Domain",
  "Other / custom"
];

// Book 1 (The War-Torn Kingdom) pre-generated starting characters' ability
// scores, one per profession -- the only professions/values confirmed
// against the actual book. Picking one is a convenience fill-in, not a
// hardcoded rule: every field stays freely editable afterwards.
const PROFESSIONS = [
  { key: "warrior", name: "Warrior", abilities: { charisma:3, combat:6, magic:2, sanctity:4, scouting:3, thievery:2 } },
  { key: "wayfarer", name: "Wayfarer", abilities: { charisma:2, combat:5, magic:2, sanctity:3, scouting:6, thievery:4 } },
  { key: "mage", name: "Mage", abilities: { charisma:2, combat:2, magic:6, sanctity:1, scouting:5, thievery:3 } },
  { key: "priest", name: "Priest", abilities: { charisma:4, combat:2, magic:3, sanctity:6, scouting:4, thievery:2 } },
  { key: "rogue", name: "Rogue", abilities: { charisma:5, combat:4, magic:4, sanctity:1, scouting:2, thievery:6 } },
  { key: "troubadour", name: "Troubadour", abilities: { charisma:6, combat:3, magic:4, sanctity:3, scouting:2, thievery:4 } }
];
function professionByName(name){ return PROFESSIONS.find(p => p.name === name) || null; }
function abilitiesAllZero(abilities){ return Object.values(abilities).every(v => !v); }

// What an equipped possession can grant a bonus to -- generalizes the old
// Defence-only bonus so a ring, amulet, blessed weapon etc. can boost any
// ability (or Stamina), the same way the D&D sheet's feats aren't limited
// to a single stat.
const BONUS_STATS = [
  { key: "defence", label: "Def" },
  { key: "charisma", label: "Cha" },
  { key: "combat", label: "Com" },
  { key: "magic", label: "Mag" },

function defaultChar(id){
  return {
    id,
    name: "",
    profession: "",
    professionCustom: false,
    god: "",
    rank: 0,
    title: "",
    money: 0,
    abilities: { charisma: 0, combat: 0, magic: 0, sanctity: 0, scouting: 0, thievery: 0 },
    staminaMax: 0,
    staminaCurrent: 0,
    possessions: [],
    titles: [],
    blessings: [],
    resurrection: "",
    codewords: [],
    journey: [],
    ticks: [],
    ships: [],
    notes: ""

}
// Back-fills missing fields so older saved/exported characters keep loading
// cleanly after new fields are added. Never rename/repurpose a field in
// place -- add a new one here instead so old exports still import fine.
function hydrate(s){
  const d = defaultChar(s.id || uid());
  const out = Object.assign({}, d, s);
  out.abilities = Object.assign({}, d.abilities, s.abilities || {});
  out.professionCustom = typeof s.professionCustom === "boolean" ? s.professionCustom : false;
  out.rank = Math.round(typeof s.rank === "number" ? s.rank : (parseFloat(s.rank) || 0));
  // Possessions used to be a plain string[], then gained a Defence-only
  // bonus ({name,defenceBonus,equipped}); now the bonus can target any
  // stat ({name,bonusStat,bonusAmount,equipped}). Migrate through both.
  out.possessions = Array.isArray(s.possessions)
    ? s.possessions.map(p => {
        if(typeof p === "string") return { name: p, bonusStat: "", bonusAmount: 0, equipped: false };
        if(typeof p.bonusStat === "string") return { name: p.name || "", bonusStat: p.bonusStat, bonusAmount: p.bonusAmount || 0, equipped: !!p.equipped };
        const bonusAmount = p.defenceBonus || 0;
        return { name: p.name || "", bonusStat: bonusAmount ? "defence" : "", bonusAmount, equipped: !!p.equipped };
      })
    : [];
  out.titles = Array.isArray(s.titles) ? s.titles : [];
  out.blessings = Array.isArray(s.blessings) ? s.blessings : [];
  out.codewords = Array.isArray(s.codewords) ? s.codewords : [];
  // "journey" replaces the older "tickoffs" name -- same shape ({book,
  // paragraph, note}[]), just renamed before this ever shipped to anyone.
  out.journey = Array.isArray(s.journey) ? s.journey : (Array.isArray(s.tickoffs) ? s.tickoffs : []);
  // "ticks" is the separate closed-list checklist (book+paragraph+checked),
  // distinct from the freeform Journey log.
  out.ticks = Array.isArray(s.ticks) ? s.ticks : [];
  out.ships = Array.isArray(s.ships) ? s.ships : [];
  return out;
}

}

/* ---------- 3D physics dice ---------- */
// Every roll throws real six-sided dice (src/dice-physics.js, embedded at
// build time -- see build.js) in a full-screen overlay and awaits the
// settled result, rather than a Math.random() value with a canned CSS
// animation. Fabled Lands only ever uses ordinary d6s, so every spec here is
// {sides:6}. The engine is created lazily on the first roll so page load
// never pays for it.
// Low-performance mode skips the physics engine entirely (never calls
// ensureDiceEngine, which is what's slow to spin up on weak hardware) and
// just rolls instantly -- the result still shows in the Dice panel/ability
// boxes via lastDiceRoll/abilityRollFlash, just without the 3D overlay.
let diceMode = storageGet("dice-mode", "3d"); // '3d' | 'simple'
function setDiceMode(mode){ diceMode = mode; storageSet("dice-mode", mode); render(); }
function showRollBanner(items){
  if(diceMode === "simple") return;
  ensureDiceEngine().showResultBanner(items);
}
let diceEngine = null;
function ensureDiceEngine(){
  if(diceEngine) return diceEngine;
  diceEngine = window.DicePhysicsModule.initDicePhysics(
    document.getElementById("dice-3d-canvas"),
    document.getElementById("dice-3d-labels"),
    {}
  );
  return diceEngine;
}
function showDiceOverlay(hint){
  const overlay = document.getElementById("dice-3d-overlay");
  const hintEl = document.getElementById("dice-3d-hint");
  overlay.classList.add("visible");
  hintEl.textContent = hint || "";
  hintEl.classList.remove("visible");
}
function hideDiceOverlay(){
  document.getElementById("dice-3d-overlay").classList.remove("visible");
  document.getElementById("dice-3d-hint").classList.remove("visible");
}
function dismissDiceOverlay(){ hideDiceOverlay(); }
async function rollPhysicalDice(count, hint){
  if(diceMode === "simple"){
    const results = [];
    for(let i=0;i<count;i++) results.push(1 + Math.floor(Math.random()*6));
    return results;
  }
  const engine = ensureDiceEngine();
  showDiceOverlay(hint);
  const results = await engine.roll([{ sides: 6, count, tag: "d6" }]);
  const hintEl = document.getElementById("dice-3d-hint");
  hintEl.textContent = hint || "";
  hintEl.classList.add("visible");
  return results.map(r => r.value);
}
let abilityRollFlash = {};
let abilityRollFlashTimers = {};
async function rollDice(n){
  const hint = n>1 ? `${n} Dice` : "1 Die";
  const results = await rollPhysicalDice(n, hint);
  const total = results.reduce((a,b)=>a+b,0);
  lastDiceRoll = { n, results, total };
  diceHistory.unshift(lastDiceRoll);
  diceHistory = diceHistory.slice(0, 8);
  showRollBanner([{ key:"roll", title: hint, value: n>1 ? `${results.join(" + ")} = ${total}` : `${total}`, y:0.42 }]);
  render();
}
async function rollAbilityCheck(key, label){
  const bonus = effectiveAbility(state, key);
  const results = await rollPhysicalDice(2, label);
  const diceTotal = results.reduce((a,b)=>a+b,0);
  const total = diceTotal + bonus;
  lastDiceRoll = { n:2, results, diceTotal, bonus, total, label };
  diceHistory.unshift(lastDiceRoll);
  diceHistory = diceHistory.slice(0, 8);
  showRollBanner([{ key:"roll", title: label, value: `${results.join(" + ")} + ${bonus} = ${total}`, y:0.42 }]);
  abilityRollFlash[key] = total;
  clearTimeout(abilityRollFlashTimers[key]);
  abilityRollFlashTimers[key] = setTimeout(() => { delete abilityRollFlash[key]; render(); }, 5000);
  render();
}
// Going up in Rank rolls 1d6 and adds it to Stamina (both the Unwounded max
// and what you currently have -- you gain that Stamina outright, the same
// way a new hit die works in D&D). Confirmed first since Rank/Stamina are
// consequential and this should only happen when the book actually tells
// you to rank up, not from a stray tap.
async function levelUp(){
  const results = await rollPhysicalDice(1, "Level Up!");
  const gain = results[0];
  state.rank = (state.rank||0) + 1;
  state.staminaMax = (state.staminaMax||0) + gain;
  state.staminaCurrent = (state.staminaCurrent||0) + gain;
  lastDiceRoll = { n:1, results, total: gain, label: "Level Up (+Stamina)" };
  diceHistory.unshift(lastDiceRoll);
  diceHistory = diceHistory.slice(0, 8);
  showRollBanner([{ key:"roll", title:"Rank Up!", value:`+${gain} Stamina — now Rank ${state.rank}`, y:0.42 }]);
  render();
  queueSave();
}

/* ---------- export / import ---------- */
function exportJSON(){
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (state.name || "character").replace(/[^a-z0-9\-_]+/gi, "_") + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImportFile(){ document.getElementById("importFileInput").click(); }
function handleImportFile(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      importParsedCharacter(parsed);
      importModalOpen = false;
      render();
    }catch(err){
      importError = "Couldn't read that file — make sure it's a JSON file exported from this sheet.";
      render();
    }
  };
  reader.readAsText(file);
  input.value = "";
}
function importParsedCharacter(parsed){
  const id = uid();
  const c = hydrate(Object.assign({}, parsed, { id }));
  charIndex.push({ id, name: c.name || "Imported" });
  saveIndex();
  storageSet("char:"+id, c);
  setLastUsedId(id);
  state = c;
}
function encodeStateToBase64(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function decodeBase64ToState(b64){ return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
function buildShareCode(){ return encodeStateToBase64(state); }
function buildShareURL(){
  const base = location.href.split("#")[0].split("?")[0];
  return base + "#char=" + encodeURIComponent(buildShareCode());
}
function copyShareLink(){
  const val = buildShareURL();
  const box = document.getElementById("shareLinkBox");
  if(box){ box.value = val; box.focus(); box.select(); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(val).catch(()=>{});
  }
}
function importFromPastedText(){
  const box = document.getElementById("importPasteBox");
  const raw = (box.value || "").trim();
  if(!raw){ importError = "Paste a share code or link first."; render(); return; }
  const m = /char=([^&\s]+)/.exec(raw);
  const code = m ? decodeURIComponent(m[1]) : raw;
  try{
    const parsed = decodeBase64ToState(code);
    importParsedCharacter(parsed);
    importModalOpen = false;
    importError = "";
    render();
  }catch(err){
    importError = "Couldn't read that code — make sure it was copied in full.";
    render();
  }
}
function checkURLImport(){
  const m = /(?:^|[#&])char=([^&]+)/.exec(location.hash);
  if(!m) return false;
  try{
    const parsed = decodeBase64ToState(decodeURIComponent(m[1]));
    importParsedCharacter(parsed);
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  }catch(err){ return false; }
}

function chipListPanel(title, icon, field, opts){
  opts = opts || {};
  const items = state[field];

  const atCap = cap && items.length >= cap;

    ? displayItems.map(({v,i}) => `<span class="chip">${esc(v)}<button type="button" class="chip-remove" onclick="removeChip('${field}',${i})" aria-label="Remove ${esc(v)}">&times;</button></span>`).join("")

function equippedBonus(s, statKey){
  return s.possessions.filter(p => p.equipped && p.bonusStat === statKey).reduce((sum, p) => sum + (p.bonusAmount||0), 0);
}
function effectiveAbility(s, key){
  return (s.abilities[key]||0) + equippedBonus(s, key);
}
function effectiveStaminaMax(s){
  return (s.staminaMax||0) + equippedBonus(s, "stamina");
}
function computeDefence(s){
  return effectiveAbility(s, "combat") + (s.rank||0) + equippedBonus(s, "defence");
}
function combatPanelHTML(){
  const s = state;
  const defence = computeDefence(s);
  const effCombat = effectiveAbility(s, "combat");
  const max = Math.max(0, effectiveStaminaMax(s));
  const staminaBonus = equippedBonus(s, "stamina");
  const cur = clamp(s.staminaCurrent||0, 0, Math.max(max, s.staminaCurrent||0));
  const pct = max > 0 ? clamp((cur/max)*100, 0, 100) : 0;
  const low = max > 0 && cur/max <= 0.33;
  return `
  <section class="panel ${foldedPanels['combat'] ? "folded" : ""}">
    <h2 class="ref-toggle" onclick="togglePanelFold('combat')">🛡️ Combat &amp; Stamina ${foldIcon('combat')}</h2>

        <div class="computed-value">${defence}</div>
        <p class="formula-note">${effCombat} Combat + ${s.rank||0} Rank + ${equippedBonus(s,"defence")} equipped</p>
      </div>
      <div class="field">

function journeyPanelHTML(){
  const s = state;

  // Newest first: the most recently logged page is always index length-1,
  // so reversing the index list (rather than the array itself) puts it on
  // top while onchange/removeRow can still address the real array position.
  const allIndices = s.journey.map((_, i) => i).reverse();
  const visible = journeyExpanded ? allIndices : allIndices.slice(0, 3);

  const rows = visible.map(i => { const row = s.journey[i]; return `
    <tr>
      <td><select onchange="set('journey.${i}.book', this.value)">${FL_BOOKS.map(b=>`<option value="${esc(b)}" ${row.book===b?"selected":""}>${esc(b)}</option>`).join("")}</select></td>

      <td><textarea rows="${estimateTextRows(row.note)}" class="journey-note-input" placeholder="optional note" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';" onchange="set('journey.${i}.note', this.value)">${esc(row.note)}</textarea></td>
      <td class="col-del no-print"><button type="button" class="icon-btn secondary" onclick="removeRow('journey', ${i})" aria-label="Remove entry">🗑</button></td>
    </tr>`; }).join("");
  const cards = visible.map(i => { const row = s.journey[i]; return `
    <div class="entry-card">
      <div class="field"><label>Book</label><select onchange="set('journey.${i}.book', this.value)">${FL_BOOKS.map(b=>`<option value="${esc(b)}" ${row.book===b?"selected":""}>${esc(b)}</option>`).join("")}</select></div>

      <div class="field"><label>Note</label><textarea rows="${estimateTextRows(row.note)}" class="journey-note-input" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';" onchange="set('journey.${i}.note', this.value)">${esc(row.note)}</textarea></div>

    <h2 class="ref-toggle" onclick="togglePanelFold('journey')">📖 Journey ${foldIcon('journey')}</h2>

      ${total > 3 ? `<button type="button" class="secondary" onclick="toggleJourneyExpanded()">${journeyExpanded ? "▲ Show last 3" : `▼ Show all (${total})`}</button>` : ""}

  </section>`;

  </section>`;
}

function diceRollSummary(h){
  const dicePart = h.results.join("+");
  if(h.bonus){
    return `${dicePart} + ${h.bonus} = ${h.total}`;
  }
  return h.n>1 ? `${dicePart} = ${h.total}` : `${h.total}`;
}
function dicePanelHTML(){
  const lr = lastDiceRoll;
  const result = lr
    ? `<div class="dice-result">${lr.results.map(v => dieFaceHTML(v)).join("")}<span class="dice-total">${diceRollSummary(lr)}</span>${lr.label ? `<span class="dice-hint-text">${esc(lr.label)}</span>` : ""}</div>`
    : `<div class="dice-result"><p class="empty-hint">No rolls yet.</p></div>`;
  const history = diceHistory.length
    ? `<div class="dice-history">${diceHistory.map(h => `<span>${h.label?esc(h.label)+": ":""}${diceRollSummary(h)}</span>`).join("")}</div>`
    : "";
  return `
  <section class="panel dice-panel ${foldedPanels['dice'] ? "folded" : ""}">
    <h2 class="ref-toggle" onclick="togglePanelFold('dice')">🎲 Dice ${foldIcon('dice')}</h2>
    <div class="roll-buttons no-print">
      <button type="button" onclick="rollDice(1)">Roll 1 die</button>
      <button type="button" onclick="rollDice(2)">Roll 2 dice</button>
    </div>
    ${result}
    ${history}
  </section>`;
}

function characterSheetHTML(){
  return `
  <div class="panels">
    ${journeyPanelHTML()}
    ${ticksPanelHTML()}
    ${identityPanelHTML()}
    ${abilitiesPanelHTML()}
    ${combatPanelHTML()}
    ${moneyPanelHTML()}
    ${dicePanelHTML()}
    ${possessionsPanelHTML()}
    ${chipListPanel("Titles &amp; Honours", "🏅", "titles", { placeholder: "Add a title..." })}
    ${chipListPanel("Blessings", "🌟", "blessings", { placeholder: "Add a blessing..." })}
    ${resurrectionPanelHTML()}
    ${chipListPanel("Codewords", "🔑", "codewords", { placeholder: "Add a codeword...", sort: true, emptyText: "None learned yet." })}
    ${shipsPanelHTML()}
    ${notesPanelHTML()}
  </div>`;
}

function noCharactersHTML(){
  return `
  <div class="no-characters">
    <h2>No characters yet</h2>
    <p>Create a new adventurer to begin, or load the example to see how the sheet works.</p>
    <div class="actions">
      <button type="button" onclick="openNewCharModal()">+ New Character</button>
      <button type="button" class="secondary" onclick="loadExampleCharacter()">Load example character</button>
      <button type="button" class="secondary" onclick="openImportModal()">Import</button>
    </div>
  </div>`;
}

/* ---------- top-level render ---------- */
function render(){
  const charOptions = charIndex.map(c => `<option value="${esc(c.id)}" ${state && state.id===c.id ? "selected" : ""}>${esc(c.name || "Unnamed")}</option>`).join("");
  const cur = state ? currentPageEntry() : null;
  const currentPageText = cur ? `${esc(cur.book)} — ¶ ${esc(cur.paragraph) || "?"}` : "No page logged yet";

  const menuRow = menuOpen ? `
      <div class="topbar-controls no-print">
        ${charIndex.length ? `<select aria-label="Select character" onchange="selectCharacter(this.value)">${charOptions}</select>` : ""}
        <button type="button" class="secondary" onclick="openNewCharModal()">+ New</button>
        ${state ? `<button type="button" class="icon-btn secondary" title="Delete character" onclick="confirmRemove(()=>deleteCharacter('${state.id}'))">🗑</button>` : ""}
        ${state ? `<button type="button" class="secondary" onclick="openExportModal()">Share / Export</button>` : ""}
        <button type="button" class="secondary" onclick="openImportModal()">Import</button>
        <button type="button" class="icon-btn secondary" title="Toggle theme" onclick="toggleTheme()">${effectiveTheme()==="dark" ? "☀️" : "🌙"}</button>
        ${state ? `<button type="button" class="secondary" onclick="setAllFolded(true)">Hide All</button>
        <button type="button" class="secondary" onclick="setAllFolded(false)">Show All</button>` : ""}
        <select aria-label="Dice mode" title="3D dice can be slow to start on older phones — Simple mode skips the animation" onchange="setDiceMode(this.value)">
          <option value="3d" ${diceMode==="3d"?"selected":""}>🎲 3D dice</option>
          <option value="simple" ${diceMode==="simple"?"selected":""}>🎲 Simple dice (faster)</option>
        </select>
        <span id="saveStatus" class="save-status"></span>
      </div>` : "";

  const topbar = `
  <header class="topbar">
    <div class="topbar-mini">
      <button type="button" class="icon-btn secondary no-print" title="Menu" onclick="toggleMenu()">☰</button>
      <div class="current-page-strip">📖 ${currentPageText}</div>
      ${state ? `<button type="button" class="secondary no-print" onclick="openLogPageModal()">+ Log page</button>` : ""}
    </div>
    ${menuRow}
  </header>`;

  const body = state ? characterSheetHTML() : noCharactersHTML();

  const modals = [
    newCharModalOpen ? newCharModalHTML() : "",
    pendingConfirm ? confirmModalHTML() : "",
    exportModalOpen && state ? exportModalHTML() : "",
    importModalOpen ? importModalHTML() : "",
    logPageModalOpen && state ? logPageModalHTML() : ""
  ].join("");

  document.getElementById("app").innerHTML = `
    ${topbar}
    <main>${body}</main>
    <footer>Unofficial fan-made tool for the <em>Fabled Lands</em> gamebooks by Dave Morris &amp; Jamie Thomson. Works fully offline; nothing leaves your device unless you share a link or file yourself.<br>__DEPLOY_TIME__</footer>
    ${modals}
  `;
  if(state){
    const el = document.getElementById("saveStatus");
    if(el) el.textContent = persistent ? "✓ Saved" : "⚠ Not saved (private browsing?)";
  }
}

/* ---------- init ---------- */
function init(){
  applyTheme();
  const imported = checkURLImport();
  if(!imported){
    const lastId = storageGet("last-char", null);
    if(lastId && charIndex.some(c => c.id === lastId)){
      loadCharacter(lastId);
    } else if(charIndex.length){
      loadCharacter(charIndex[0].id);
    }
  }
  render();
}
init();
</script>
</body>
</html>
